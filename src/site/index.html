<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://sgx.geodatenzentrum.de; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://sgx.geodatenzentrum.de; worker-src 'self' blob:; font-src 'self' https://demotiles.maplibre.org">
  <title>Baumfläche</title>
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map" role="application" aria-label="Karte der Baumflächen in Mannheim"></div>

  <div id="left-stack">
  <aside id="legend" aria-label="Legende">
    <h1>Baumfläche</h1>
    <p class="legend-desc">Durchschnittlicher Baumanteil im 60-m-Umkreis</p>
    <div class="legend-gradient" role="img" aria-label="Farbverlauf von 0 bis 100 Prozent Baumfläche">
      <div class="legend-gradient-bar" aria-hidden="true"></div>
      <ol class="legend-gradient-ticks" aria-hidden="true">
        <li style="left:0%">0</li>
        <li style="left:15%">15</li>
        <li style="left:30%">30</li>
        <li style="left:50%">50</li>
        <li style="left:100%">100</li>
      </ol>
    </div>
    <ol class="legend-stops sr-only">
      <li>0</li>
      <li>15</li>
      <li>30</li>
      <li>50</li>
      <li>100</li>
    </ol>
    <p class="legend-units">Prozent</p>
  </aside>

  <div id="controls">
    <button id="baeume" type="button" aria-pressed="false">Bäume</button>
    <label class="brightness" for="brightness-slider">
      <span>Helligkeit</span>
      <input type="range" id="brightness-slider" min="5" max="100" value="65">
    </label>
  </div>
  </div>

  <div id="attribution"></div>

  <script src="vendor/maplibre-gl.js"></script>
  <script src="vendor/pmtiles.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
